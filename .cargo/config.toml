# A plain `cargo build --target x86_64-unknown-linux-musl` must link the
# embedded Go core with a fixed constructor, or the binary segfaults on the
# first Go call. The linker wrapper applies scripts/patch_go_ctor.py after
# linking; release cross-builds do the same explicitly in cross-compile.sh.
[target.x86_64-unknown-linux-musl]
linker = "scripts/musl-link.sh"
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-no-pie"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded CI run: pushing twice in a row shouldn't queue two
# identical builds. PR runs keyed by PR ref, main runs by the commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Verify version consistency
        run: |
          VERSION_GO=$(grep -oP 'const Version = "odm/\K[^"]+' internal/version/version.go)
          [ -n "$VERSION_GO" ] || { echo "::error::Could not extract version from version.go"; exit 1; }
          bash .github/scripts/verify-version.sh "$VERSION_GO"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -race -count=1 ./...

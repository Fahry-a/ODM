name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Apply exact audit cleanup
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          from pathlib import Path
          p = Path("internal/download/task.go")
          s = p.read_text()
          old_const = '''\t// throttleCooldown is how long after the latest 429 before a successful
\t// chunk restores the user's configured rate (see downloadChunk/throttleOK).
\tthrottleCooldown = 30 * time.Second
'''
          old_field = '''\t// lastThrottle tracks the most recent 429 so throttleOK only restores the
\t// configured rate after a quiet period, not on the first healthy chunk.
\tlastThrottle atomic.Int64 // unix nanos; 0 = never throttled
'''
          for label, old in (("throttleCooldown", old_const), ("lastThrottle", old_field)):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              s = s.replace(old, "", 1)
          p.write_text(s)
          if "throttleCooldown" in p.read_text() or "lastThrottle" in p.read_text():
              raise SystemExit("obsolete throttle state still present")

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Verify version consistency
        run: |
          VERSION_GO=$(grep -oP 'const Version = "odm/\K[^"]+' internal/version/version.go)
          [ -n "$VERSION_GO" ] || { echo "::error::Could not extract version from version.go"; exit 1; }
          bash .github/scripts/verify-version.sh "$VERSION_GO"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -race -count=1 ./...

      - name: Persist exact cleanup
        if: github.event_name == 'pull_request' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > .github/workflows/ci.yml <<'EOF'
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded CI run: pushing twice in a row shouldn't queue two
# identical builds. PR runs keyed by PR ref, main runs by the commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Verify version consistency
        run: |
          VERSION_GO=$(grep -oP 'const Version = "odm/\K[^"]+' internal/version/version.go)
          [ -n "$VERSION_GO" ] || { echo "::error::Could not extract version from version.go"; exit 1; }
          bash .github/scripts/verify-version.sh "$VERSION_GO"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -race -count=1 ./...
EOF
          git add internal/download/task.go .github/workflows/ci.yml
          git diff --cached --check
          git diff --cached -- internal/download/task.go
          git diff --cached -- .github/workflows/ci.yml
          git commit -m "fix: remove obsolete throttle task state"
          git push origin HEAD:fix/full-audit-v2

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Verify version consistency
        run: |
          VERSION_GO=$(grep -oP 'const Version = "odm/\K[^"]+' internal/version/version.go)
          PKGBUILD_VER=$(grep -oP '^pkgver=\K.*' packaging/PKGBUILD)
          if [ -z "$VERSION_GO" ] || [ "$VERSION_GO" != "$PKGBUILD_VER" ]; then
            echo "::error::Version mismatch: version.go=$VERSION_GO pkgbuild=$PKGBUILD_VER"
            echo "::error::The two version locations must stay in sync (see AGENTS.md)."
            exit 1
          fi
          echo "Versions in sync: $VERSION_GO"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -race -count=1 ./...

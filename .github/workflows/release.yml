name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release without the v prefix (e.g. 1.2.0)"
        required: true
        type: string
      overwrite:
        description: "Overwrite existing release (delete + recreate)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # needed to dispatch aur-publish.yml (gh workflow run)

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract tag version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag version: $TAG"

      - name: Extract version from code
        id: code
        run: |
          VERSION_GO=$(grep -oP 'const Version = "odm/\K[^"]+' internal/version/version.go)
          PKGBUILD_VER=$(grep -oP 'pkgver=\K.*' packaging/PKGBUILD)
          echo "version_go=$VERSION_GO" >> "$GITHUB_OUTPUT"
          echo "pkgbuild=$PKGBUILD_VER" >> "$GITHUB_OUTPUT"
          echo "Code versions: version.go=$VERSION_GO pkgbuild=$PKGBUILD_VER"

      - name: Verify versions match
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          VERSION_GO="${{ steps.code.outputs.version_go }}"
          PKGBUILD="${{ steps.code.outputs.pkgbuild }}"

          echo "Comparing: tag=$TAG vs version.go=$VERSION_GO vs pkgbuild=$PKGBUILD"

          FAIL=0
          if [ "$TAG" != "$VERSION_GO" ]; then
            echo "::error::Tag ($TAG) does not match internal/version/version.go ($VERSION_GO)"
            FAIL=1
          fi
          if [ "$TAG" != "$PKGBUILD" ]; then
            echo "::error::Tag ($TAG) does not match packaging/PKGBUILD ($PKGBUILD)"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Version mismatch detected. Bump both versions before tagging."
            exit 1
          fi

          echo "All versions match: $TAG"

      - name: Delete existing release (overwrite mode)
        if: github.event_name == 'workflow_dispatch' && inputs.overwrite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          echo "Deleting existing release for $TAG (if exists)..."
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/^## \[/, ""); gsub(/\].*/, "")
              if ($0 == ver) found=1
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::No changelog entry found for $VERSION in CHANGELOG.md"
            echo "::error::Add a '## [$VERSION]' section before releasing (see AGENTS.md)."
            exit 1
          fi

          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes extracted:"
          cat /tmp/release-notes.md

      - name: Cross-compile
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          LDFLAGS="-s -w -buildid="
          export CGO_ENABLED=0
          export GOFLAGS="-trimpath -mod=readonly"
          export GOTOOLCHAIN=local

          TARGETS="linux/386 linux/amd64 linux/arm linux/arm64 darwin/amd64 darwin/arm64"

          mkdir -p build

          for TARGET in $TARGETS; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            OUTPUT="build/odm_${VERSION}_${GOOS}_${GOARCH}"
            echo "Building $OUTPUT ..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="$LDFLAGS" -o "$OUTPUT" ./cmd/odm
          done

          echo "Build artifacts:"
          ls -lh build/

      - name: Generate checksums
        run: |
          cd build
          sha256sum odm_${{ steps.tag.outputs.version }}_* > checksums.txt
          echo "Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: v${{ steps.tag.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            build/odm_${{ steps.tag.outputs.version }}_*
            build/checksums.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}

      - name: Dispatch AUR publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # workflow_dispatch is exempt from GitHub's recursion guard (the same
          # reason auto-tag.yml dispatches this workflow explicitly), so this
          # reliably starts aur-publish.yml where a workflow_run chain would be
          # suppressed for GITHUB_TOKEN-triggered runs.
          gh workflow run aur-publish.yml -f "tag=v${VERSION}" --ref main
          echo "Dispatched aur-publish.yml for v$VERSION"

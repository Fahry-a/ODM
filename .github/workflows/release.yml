name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release without the v prefix (e.g. 1.2.0)"
        required: true
        type: string
      overwrite:
        description: "Overwrite existing release (delete + recreate)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # needed to dispatch aur-publish.yml (gh workflow run)

# One run per tag: a re-dispatch for the same tag must queue behind the
# original, not race it (duplicate releases / AUR publishes).
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 so `git log` between tags works for the per-release
      # contributors list (and the changelog extraction below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract tag version
        id: tag
        run: |
          VERSION=$(bash .github/scripts/extract-version.sh "${{ github.event_name }}" "${{ inputs.tag }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify versions match
        run: bash .github/scripts/verify-version.sh "${{ steps.tag.outputs.version }}"

      - name: Delete existing release (overwrite mode)
        if: github.event_name == 'workflow_dispatch' && inputs.overwrite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          echo "Deleting existing release for $TAG (if exists)..."
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Extract changelog
        id: changelog
        run: bash .github/scripts/extract-changelog.sh "${{ steps.tag.outputs.version }}"

      - name: Append contributors to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-contributors.sh "${{ steps.tag.outputs.version }}"

      - name: Cross-compile
        run: bash .github/scripts/cross-compile.sh "${{ steps.tag.outputs.version }}"

      - name: Generate checksums
        run: bash .github/scripts/gen-checksums.sh "${{ steps.tag.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: v${{ steps.tag.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            build/odm_${{ steps.tag.outputs.version }}_*
            build/checksums.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}

      - name: Dispatch AUR publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # workflow_dispatch is exempt from GitHub's recursion guard (the same
          # reason auto-tag.yml dispatches this workflow explicitly), so this
          # reliably starts aur-publish.yml where a workflow_run chain would be
          # suppressed for GITHUB_TOKEN-triggered runs.
          gh workflow run aur-publish.yml -f "tag=v${VERSION}" --ref main
          echo "Dispatched aur-publish.yml for v$VERSION"

      # The registry mirror is opt-in so existing releases keep working
      # until FOENUI_UPLOAD_TOKEN has been configured in repository settings.
      - name: Check Foenui PM publishing configuration
        id: foenui-pm
        env:
          FOENUI_UPLOAD_TOKEN: ${{ secrets.FOENUI_UPLOAD_TOKEN }}
        run: |
          if [[ -n "$FOENUI_UPLOAD_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Foenui PM publishing is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Foenui PM mirror skipped::Add the FOENUI_UPLOAD_TOKEN repository secret to mirror future release tarballs."
          fi

      - name: Publish linux/386 to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: build/odm_${{ steps.tag.outputs.version }}_linux_386.tar.gz
          owner: foenui
          organization: "true"
          package: odm
          version: ${{ steps.tag.outputs.version }}
          os: linux
          arch: "386"
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Publish linux/amd64 to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: build/odm_${{ steps.tag.outputs.version }}_linux_amd64.tar.gz
          owner: foenui
          organization: "true"
          package: odm
          version: ${{ steps.tag.outputs.version }}
          os: linux
          arch: amd64
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Publish linux/arm to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: build/odm_${{ steps.tag.outputs.version }}_linux_arm.tar.gz
          owner: foenui
          organization: "true"
          package: odm
          version: ${{ steps.tag.outputs.version }}
          os: linux
          arch: arm
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Publish linux/arm64 to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: build/odm_${{ steps.tag.outputs.version }}_linux_arm64.tar.gz
          owner: foenui
          organization: "true"
          package: odm
          version: ${{ steps.tag.outputs.version }}
          os: linux
          arch: arm64
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Publish darwin/amd64 to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: build/odm_${{ steps.tag.outputs.version }}_darwin_amd64.tar.gz
          owner: foenui
          organization: "true"
          package: odm
          version: ${{ steps.tag.outputs.version }}
          os: darwin
          arch: amd64
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Publish darwin/arm64 to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: build/odm_${{ steps.tag.outputs.version }}_darwin_arm64.tar.gz
          owner: foenui
          organization: "true"
          package: odm
          version: ${{ steps.tag.outputs.version }}
          os: darwin
          arch: arm64
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

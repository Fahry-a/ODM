name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract tag version
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag version: $TAG"

      - name: Extract version from code
        id: code
        run: |
          CONFIG_VER=$(grep -oP 'const Version = "odm/\K[^"]+' internal/config/config.go)
          MANAGER_VER=$(grep -oP 'const Version = "odm/\K[^"]+' internal/download/manager.go)
          PKGBUILD_VER=$(grep -oP 'pkgver=\K.*' packaging/PKGBUILD)
          echo "config=$CONFIG_VER" >> "$GITHUB_OUTPUT"
          echo "manager=$MANAGER_VER" >> "$GITHUB_OUTPUT"
          echo "pkgbuild=$PKGBUILD_VER" >> "$GITHUB_OUTPUT"
          echo "Code versions: config=$CONFIG_VER manager=$MANAGER_VER pkgbuild=$PKGBUILD_VER"

      - name: Verify versions match
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          CONFIG="${{ steps.code.outputs.config }}"
          MANAGER="${{ steps.code.outputs.manager }}"
          PKGBUILD="${{ steps.code.outputs.pkgbuild }}"

          echo "Comparing: tag=$TAG vs config=$CONFIG vs manager=$MANAGER vs pkgbuild=$PKGBUILD"

          FAIL=0
          if [ "$TAG" != "$CONFIG" ]; then
            echo "::error::Tag ($TAG) does not match internal/config/config.go ($CONFIG)"
            FAIL=1
          fi
          if [ "$TAG" != "$MANAGER" ]; then
            echo "::error::Tag ($TAG) does not match internal/download/manager.go ($MANAGER)"
            FAIL=1
          fi
          if [ "$TAG" != "$PKGBUILD" ]; then
            echo "::error::Tag ($TAG) does not match packaging/PKGBUILD ($PKGBUILD)"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Version mismatch detected. Bump all versions before tagging."
            exit 1
          fi

          echo "All versions match: $TAG"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          # Extract section between "## [VERSION]" and the next "## [" header
          # Using awk to grab lines from the version header until the next version header
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/^## \[/, ""); gsub(/\].*/, "")
              if ($0 == ver) found=1
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::warning::No changelog entry found for $VERSION, using 'Release $VERSION'"
            NOTES="Release $VERSION"
          fi

          # Write to file for multiline output
          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes extracted:"
          cat /tmp/release-notes.md

      - name: Cross-compile
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          LDFLAGS="-s -w -buildid="
          export CGO_ENABLED=0
          export GOFLAGS="-trimpath -mod=readonly"
          export GOTOOLCHAIN=local

          TARGETS="linux/386 linux/amd64 linux/arm linux/arm64 darwin/amd64 darwin/arm64"

          mkdir -p build

          for TARGET in $TARGETS; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            OUTPUT="build/odm_${VERSION}_${GOOS}_${GOARCH}"
            echo "Building $OUTPUT ..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="$LDFLAGS" -o "$OUTPUT" ./cmd/odm
          done

          echo "Build artifacts:"
          ls -lh build/

      - name: Generate checksums
        run: |
          cd build
          sha256sum odm_${{ steps.tag.outputs.version }}_* > checksums.txt
          echo "Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.tag.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            build/odm_${{ steps.tag.outputs.version }}_*
            build/checksums.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release without the v prefix (e.g. 1.2.0)"
        required: true
        type: string
      overwrite:
        description: "Overwrite existing release (delete + recreate)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # needed to dispatch aur-publish.yml (gh workflow run)

# One run per tag: a re-dispatch for the same tag must queue behind the
# original, not race it (duplicate releases / AUR publishes).
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # fetch-depth: 0 so `git log` between tags works for the per-release
      # contributors list (and the changelog extraction below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract tag version
        id: tag
        run: |
          VERSION=$(bash .github/scripts/extract-version.sh "${{ github.event_name }}" "${{ inputs.tag }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify versions match
        run: bash .github/scripts/verify-version.sh "${{ steps.tag.outputs.version }}"

      - name: Delete existing release (overwrite mode)
        if: github.event_name == 'workflow_dispatch' && inputs.overwrite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          echo "Deleting existing release for $TAG (if exists)..."
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Extract changelog
        run: bash .github/scripts/extract-changelog.sh "${{ steps.tag.outputs.version }}"

      - name: Append contributors to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-contributors.sh "${{ steps.tag.outputs.version }}"

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: /tmp/release-notes.md

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: i686-unknown-linux-musl,       os: linux,  arch: "386" }
          - { triple: x86_64-unknown-linux-musl,     os: linux,  arch: amd64 }
          - { triple: armv7-unknown-linux-musleabihf, os: linux,  arch: arm }
          - { triple: aarch64-unknown-linux-musl,    os: linux,  arch: arm64 }
          - { triple: x86_64-apple-darwin,           os: darwin, arch: amd64 }
          - { triple: aarch64-apple-darwin,          os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The cargo-zigbuild image ships the macOS SDK (required for the darwin
      # targets) plus cargo-zigbuild itself.
      - name: Cross-compile one target
        run: |
          docker run --rm -v "$PWD:/io" -w /io ghcr.io/rust-cross/cargo-zigbuild:latest \
            bash -c '
              set -euo pipefail
              # build.rs builds the Go core archives (gitignored); the
              # cargo-zigbuild image may not ship Go at all, and distro
              # packages are usually older than gocore/go.mod. Install the
              # exact version from the module file into /usr/local/go.
              GO_VERSION="$(grep -oP "^go \\K[0-9.]+" gocore/go.mod)"
              if ! command -v go >/dev/null 2>&1 || ! go version | grep -q "$GO_VERSION"; then
                if command -v apt-get >/dev/null 2>&1; then
                  apt-get update -qq && apt-get install -y -qq curl ca-certificates
                elif command -v apk >/dev/null 2>&1; then
                  apk add --no-cache curl ca-certificates
                fi
                curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
              fi
              export PATH="/usr/local/go/bin:$PATH"
              go version
              rustup target add ${{ matrix.triple }}
              bash .github/scripts/cross-compile.sh "${{ needs.meta.outputs.version }}" "${{ matrix.triple }}"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odm-${{ matrix.os }}-${{ matrix.arch }}
          path: build/odm_*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: odm-*
          merge-multiple: true
          path: build

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: /tmp

      - name: Generate checksums
        run: bash .github/scripts/gen-checksums.sh "${{ needs.meta.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            build/odm_${{ needs.meta.outputs.version }}_*
            build/checksums.txt
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}

      - name: Dispatch AUR publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          # workflow_dispatch is exempt from GitHub's recursion guard (the same
          # reason auto-tag.yml dispatches this workflow explicitly), so this
          # reliably starts aur-publish.yml where a workflow_run chain would be
          # suppressed for GITHUB_TOKEN-triggered runs.
          gh workflow run aur-publish.yml -f "tag=v${VERSION}" --ref main
          echo "Dispatched aur-publish.yml for v$VERSION"

  publish:
    name: Publish ${{ matrix.os }}/${{ matrix.arch }} to Foenui PM
    needs: [meta, release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: "386" }
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm }
          - { os: linux,  arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: odm-${{ matrix.os }}-${{ matrix.arch }}
          path: build

      # The registry mirror is opt-in so existing releases keep working
      # until FOENUI_UPLOAD_TOKEN has been configured in repository settings.
      - name: Check Foenui PM publishing configuration
        id: foenui-pm
        env:
          FOENUI_UPLOAD_TOKEN: ${{ secrets.FOENUI_UPLOAD_TOKEN }}
        run: |
          if [[ -n "$FOENUI_UPLOAD_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Foenui PM publishing is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Foenui PM mirror skipped::Add the FOENUI_UPLOAD_TOKEN repository secret to mirror future release tarballs."
          fi

      - name: Publish to Foenui PM
        if: ${{ steps.foenui-pm.outputs.enabled == 'true' }}
        uses: foenui/foenui-pm-action@73cbb7296ad377688b3f3a19819a0825a6d38db9
        with:
          source: build/odm_${{ needs.meta.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          owner: fahry-a
          organization: "false"
          package: odm
          version: ${{ needs.meta.outputs.version }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          overwrite: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

# Auto Tag
#
# The "productively lazy" half of the release pipeline: instead of manually
# running `git tag vX.Y.Z -m "release: vX.Y.Z"`, this workflow watches main.
# When a push bumps the version in both version-bearing files AND the
# CHANGELOG has an entry for it, an annotated tag is created — and since a
# GITHUB_TOKEN tag push can't trigger release.yml on its own, release.yml is
# dispatched explicitly. The recursion guard suppresses workflow_run chains
# off GITHUB_TOKEN-triggered runs too, so release.yml likewise dispatches
# aur-publish.yml explicitly — full chain: auto-tag → release.yml
# (GitHub Release) → aur-publish.yml (AUR).
#
# Safeguards so it never tags the wrong thing:
#   1. Strict consistency — both files must carry the SAME version, or the
#      workflow fails loudly (catches "forgot to bump one file" on the push).
#   2. Idempotency — if vX.Y.Z already exists, or the version is not newer than
#      the latest existing tag, nothing happens (a normal docs-only push to
#      main is a no-op, not a failure).
#   3. Changelog gate — a version bump without a matching `## [X.Y.Z]` header
#      is rejected so release notes are never empty.
#
# Push the tag only after every guard passes; release.yml then does the rest.

name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write # needed to dispatch release.yml (gh workflow run)

jobs:
  auto-tag:
    name: Tag released version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need every tag to compute "latest"

      - name: Extract + validate versions
        id: validate
        run: |
          set -euo pipefail
          VERSION_GO=$(grep -oP 'const Version = "odm/\K[^"]+' internal/version/version.go)
          PKGBUILD_VER=$(grep -oP '^pkgver=\K.*' packaging/PKGBUILD)
          if [ -z "$VERSION_GO" ] || [ -z "$PKGBUILD_VER" ]; then
            echo "::error::Could not extract a version from one of the files"
            exit 1
          fi
          bash .github/scripts/verify-version.sh "$VERSION_GO"
          echo "version=$VERSION_GO" >> "$GITHUB_OUTPUT"
          echo "Both files match: $VERSION_GO"

      - name: Check existing tag / version order
        id: check
        run: bash .github/scripts/tag-check.sh "${{ steps.validate.outputs.version }}"

      - name: Create and push tag
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/tag-create.sh "${{ steps.validate.outputs.version }}"

      - name: Trigger release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/tag-trigger.sh "${{ steps.validate.outputs.version }}"

name: Publish AUR

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  aur-publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all tags so we can resolve the release commit

      - name: Resolve version tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            # Resolve the released version from the commit the Release run used.
            # head_branch is unreliable for tag-triggered workflow_runs (it can
            # be the tag, a branch, or empty depending on how the release was
            # fired). git describe finds the nearest reachable v* tag, which is
            # the exact tag for a tag-push release and the release tag on the
            # branch for a workflow_dispatch release.
            TAG=$(git describe --tags --abbrev=0 "$RUN_SHA" 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "::error::No reachable v* tag from workflow run commit $RUN_SHA"
              exit 1
            fi
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD pkgver
        working-directory: packaging
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD

      - name: Copy bundled files with versioned names
        working-directory: packaging
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PKGNAME=$(grep -oP '^pkgname=\K.*' PKGBUILD)
          cp ../docs/odm.1 "${PKGNAME}-${VERSION}.1"
          cp ../configs/odm.conf.example "${PKGNAME}-${VERSION}.conf.example"
          cp ../packaging/odm.service "${PKGNAME}-${VERSION}.service"

      - name: Get binary checksum and update PKGBUILD
        working-directory: packaging
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          curl -fsSL -o /tmp/checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/checksums.txt"

          AMD64_SUM=$(awk -v file="odm_${VERSION}_linux_amd64" '$2 == file { print $1; exit }' /tmp/checksums.txt)
          ARM64_SUM=$(awk -v file="odm_${VERSION}_linux_arm64" '$2 == file { print $1; exit }' /tmp/checksums.txt)

          if [ -z "$AMD64_SUM" ] || [ -z "$ARM64_SUM" ]; then
            echo "::error::Missing binary checksum in release artifacts"
            exit 1
          fi

          export AMD64_SUM ARM64_SUM
          python3 ../scripts/update-aur-checksums.py

      - name: Verify checksums and regenerate .SRCINFO
        working-directory: packaging
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -c "
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c 'makepkg --verifysource --nodeps'
            su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          "

      - name: Validate
        working-directory: packaging
        run: |
          set -euo pipefail
          errors=0
          grep -q "^pkgname=odm-bin$" PKGBUILD || { echo "::error::Missing pkgname"; errors=1; }
          grep -q "^pkgver=${{ steps.version.outputs.version }}$" PKGBUILD || { echo "::error::Wrong pkgver"; errors=1; }
          [ "$errors" -eq 0 ] || exit 1

      - name: Publish AUR
        uses: ulises-jeremias/github-actions-aur-publish@v1
        with:
          pkgname: odm-bin
          pkgbuild: packaging/PKGBUILD
          assets: |
            packaging/.SRCINFO
            packaging/*.1
            packaging/*.conf.example
            packaging/*.service
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore(aur): update to v${{ steps.version.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          update_pkgver: false

      - name: Clean up generated assets
        working-directory: packaging
        run: rm -f odm-bin-*.*

      - name: Commit to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          # Rebase the PKGBUILD/.SRCINFO edits onto the latest main, then push
          # explicitly. A bare `git push` only works on a branch checkout; the
          # default checkout here is detached, so an explicit branch+refspec is
          # required to land the commit on main.
          git checkout -B aur-publish origin/main
          git add packaging/PKGBUILD packaging/.SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "chore(aur): update PKGBUILD and .SRCINFO for v${{ steps.version.outputs.version }}"
            git push origin aur-publish:main
          else
            echo "No changes to commit"
          fi
